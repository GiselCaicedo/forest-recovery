server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Tipos para los archivos que descarga/abre la app.
  types {
    text/html                 html;
    text/css                  css;
    application/javascript    js;
    font/ttf                  ttf;
    text/csv                  csv;
    text/markdown             md;
    application/json          json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
